<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>MiniMind-O 初始化速查</title><link rel="stylesheet" href="../assets/lesson.css"></head><body><main><h1>MiniMind-O 初始化速查</h1><p>父类：model/thinker、lm_head；新增：talker、audio_proj、vision_proj；可选冻结编码器：audio_encoder、vision_encoder。</p><p>维度流：audio_hidden_size -> audio_proj -> hidden_size；image_hidden_size -> vision_proj -> hidden_size。</p><p>口诀：先父类，后别名；先桥接，后编码器；构造模块不等于加载权重。</p></main></body></html>
